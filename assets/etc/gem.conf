# gem settings, use unquoted KEY=VALUE, environment overrides this file
# the file is optional, missing settings use the defaults shown below
# video: auto, ega, vga, cga, herc, hercules, or pega
GEM_VIDEO=auto
# keyboard console, the default also tries /dev/console if tty1 is unavailable
# CONSOLE=/dev/tty1
# mouse: ms (Microsoft serial), amstrad (PC1512/1640), or none
MOUSE_PROTOCOL=ms
# COM1 is /dev/ttyS0, COM2 is /dev/ttyS1, use none to disable the mouse
# dont run a getty or a serial console on the mouse port
MOUSE_PORT=/dev/ttyS0
